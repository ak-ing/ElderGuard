# 每次推送 main、提 PR：单测 + Lint + 打正式包，APK 放在本次运行的 Artifacts 里。
# 推送 v* 标签（如 v1.1.0）：另外检查标签和 versionName 一致，用发布签名打包，建 GitHub Release 并附上 APK。
#
# 发布签名来自仓库 Secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64  jks 文件的 base64
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# 没有配置时照常构建，只是 APK 不签名（不能安装，只用来确认能编译）；发版时没有签名直接失败。
name: 构建

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: 读取版本号
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = "true" ] && [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 versionName $name 不一致"
            exit 1
          fi

      - name: 写入发布签名
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: 单测、Lint、打包
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: 整理 APK
        id: apk
        run: |
          dir=app/build/outputs/apk/release
          if [ -f "$dir/app-release.apk" ]; then
            file="ElderGuard-${{ steps.version.outputs.name }}.apk"
            cp "$dir/app-release.apk" "$file"
          else
            [ "$IS_TAG" = "true" ] && { echo "::error::发版需要发布签名，请先配置仓库 Secrets"; exit 1; }
            file="ElderGuard-${{ steps.version.outputs.name }}-unsigned.apk"
            cp "$dir/app-release-unsigned.apk" "$file"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: app/build/reports/

      - name: 建 GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" --title "长辈守护 ${{ steps.version.outputs.name }}" --generate-notes

      - name: 清理签名文件
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
